name: Public domain control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Public-edge operation"
        required: true
        type: choice
        options: [provision, lockdown, destroy]
      project_config:
        description: "Non-sensitive project configuration path"
        required: true
        default: "infra/terraform/projects/config/memory-director.json"
      environment_config:
        description: "Non-sensitive environment configuration path"
        required: true
        default: "infra/terraform/projects/config/sandbox.json"
      confirm:
        description: "Required only for destroy: DESTROY_PUBLIC_EDGE"
        required: false

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  public-edge:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require explicit public-edge destroy confirmation
        if: inputs.operation == 'destroy'
        run: test "${{ inputs.confirm }}" = "DESTROY_PUBLIC_EDGE"
      - id: config
        name: Read non-sensitive configuration
        shell: bash
        run: |
          set -euo pipefail
          project_config_file="$GITHUB_WORKSPACE/${{ inputs.project_config }}"
          environment_config_file="$GITHUB_WORKSPACE/${{ inputs.environment_config }}"
          test -f "$project_config_file"
          test -f "$environment_config_file"
          state_bucket="$(jq -r '.state_bucket_name // empty' "$project_config_file")"
          project_id="$(jq -r '.project_id // empty' "$project_config_file")"
          resource_name="$(jq -r '.resource_name // empty' "$project_config_file")"
          domain="$(jq -r '.public_edge.apex_domain // empty' "$project_config_file")"
          zone_id="$(jq -r '.public_edge.cloudflare_zone_id // empty' "$project_config_file")"
          region="$(jq -r '.region // empty' "$project_config_file")"
          if [ -z "$region" ]; then
            region="$(jq -r '.default_region' infra/terraform/projects/config/common-environment.json)"
          fi
          test -n "$state_bucket"
          test -n "$project_id"
          test -n "$resource_name"
          test -n "$domain"
          test -n "$zone_id"
          {
            echo "project_config_file=$project_config_file"
            echo "environment_config_file=$environment_config_file"
            echo "state_bucket=$state_bucket"
            echo "project_id=$project_id"
            echo "resource_name=$resource_name"
            echo "domain=$domain"
            echo "zone_id=$zone_id"
            echo "region=$region"
          } >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Require Cloudflare DNS token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Initialize public-edge state
        run: |
          terraform -chdir=infra/terraform/components/public-edge init \
            -backend-config="bucket=${{ steps.config.outputs.state_bucket }}" \
            -backend-config="prefix=memory-director/sandbox/public-edge"
      - name: Import existing Cloudflare DNS records
        if: inputs.operation != 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          zone_id="${{ steps.config.outputs.zone_id }}"
          domain="${{ steps.config.outputs.domain }}"
          args=(
            -var="project_config=${{ steps.config.outputs.project_config_file }}"
            -var="environment_config=${{ steps.config.outputs.environment_config_file }}"
            -var="operation_mode=${{ inputs.operation == 'lockdown' && 'lockdown' || 'provision' }}"
          )

          import_record() {
            local address="$1"
            local fqdn="$2"
            local record_type="$3"
            local response count record_id

            if terraform -chdir=infra/terraform/components/public-edge state show "$address" >/dev/null 2>&1; then
              return
            fi

            response="$(curl --fail-with-body --silent --show-error --get \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-urlencode "name=$fqdn" \
              --data-urlencode "type=$record_type")"
            test "$(jq -r '.success' <<<"$response")" = "true"
            count="$(jq '.result | length' <<<"$response")"
            if [ "$count" = "0" ]; then
              return
            fi
            if [ "$count" != "1" ]; then
              echo "Expected at most one $record_type record for $fqdn; found $count." >&2
              exit 1
            fi
            record_id="$(jq -r '.result[0].id' <<<"$response")"
            test -n "$record_id"
            terraform -chdir=infra/terraform/components/public-edge import "${args[@]}" "$address" "$zone_id/$record_id"
          }

          import_record "module.public_edge.cloudflare_dns_record.apex" "$domain" "A"
          import_record "module.public_edge.cloudflare_dns_record.www" "www.$domain" "CNAME"
      - name: Apply or destroy public-edge resources
        shell: bash
        run: |
          set -euo pipefail
          args=(
            -var="project_config=${{ steps.config.outputs.project_config_file }}"
            -var="environment_config=${{ steps.config.outputs.environment_config_file }}"
            -var="operation_mode=${{ inputs.operation == 'lockdown' && 'lockdown' || 'provision' }}"
          )
          if [ "${{ inputs.operation }}" = "destroy" ]; then
            terraform -chdir=infra/terraform/components/public-edge destroy -auto-approve "${args[@]}"
          else
            terraform -chdir=infra/terraform/components/public-edge apply -auto-approve "${args[@]}"
          fi
      - name: Record public-edge outputs
        if: inputs.operation != 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform/components/public-edge output -json | tee public-edge-outputs.json
          {
            echo "## Public edge"
            echo
            echo "- Domain: https://${{ steps.config.outputs.domain }}"
            echo "- IP: $(jq -r '.edge_ip.value' public-edge-outputs.json)"
            echo "- Certificate resource: $(jq -r '.certificate_name.value' public-edge-outputs.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify HTTPS before lockdown
        if: inputs.operation == 'lockdown'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 10 "https://${{ steps.config.outputs.domain }}/" >/dev/null
          curl --fail --location --retry 3 --retry-delay 10 "https://${{ steps.config.outputs.domain }}/api/health" >/dev/null
      - name: Restrict API and web Cloud Run ingress
        if: inputs.operation == 'lockdown'
        shell: bash
        run: |
          set -euo pipefail
          api_prefix="memory-director/sandbox/app-api"
          web_prefix="memory-director/sandbox/app-web"
          api_image="$(gcloud run services describe "${{ steps.config.outputs.resource_name }}-api" --project "${{ steps.config.outputs.project_id }}" --region "${{ steps.config.outputs.region }}" --format='value(spec.template.spec.containers[0].image)')"
          web_image="$(gcloud run services describe "${{ steps.config.outputs.resource_name }}-web" --project "${{ steps.config.outputs.project_id }}" --region "${{ steps.config.outputs.region }}" --format='value(spec.template.spec.containers[0].image)')"
          mcp_endpoint="$(gcloud run services describe "${{ steps.config.outputs.resource_name }}-mcp" --project "${{ steps.config.outputs.project_id }}" --region "${{ steps.config.outputs.region }}" --format='value(status.url)')"
          test -n "$api_image"
          test -n "$web_image"
          test -n "$mcp_endpoint"
          terraform -chdir=infra/terraform/components/app init -reconfigure -backend-config="bucket=${{ steps.config.outputs.state_bucket }}" -backend-config="prefix=$api_prefix"
          terraform -chdir=infra/terraform/components/app apply -auto-approve \
            -var="project_config=${{ steps.config.outputs.project_config_file }}" \
            -var="environment_config=${{ steps.config.outputs.environment_config_file }}" \
            -var="service=api" -var="api_image=$api_image" -var="web_image=unused" \
            -var="mcp_endpoint=$mcp_endpoint" -var="public_ingress=false"
          terraform -chdir=infra/terraform/components/app init -reconfigure -backend-config="bucket=${{ steps.config.outputs.state_bucket }}" -backend-config="prefix=$web_prefix"
          terraform -chdir=infra/terraform/components/app apply -auto-approve \
            -var="project_config=${{ steps.config.outputs.project_config_file }}" \
            -var="environment_config=${{ steps.config.outputs.environment_config_file }}" \
            -var="service=web" -var="api_image=unused" -var="web_image=$web_image" \
            -var="api_base_url=https://${{ steps.config.outputs.domain }}/api" -var="public_ingress=false"
