name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/clickhouse/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/clickhouse.yml"
  workflow_dispatch:
    inputs:
      component:
        description: "Daily Terraform component"
        required: true
        type: choice
        options: [platform, app]
      operation:
        description: "Safe operation"
        required: true
        type: choice
        options: [validate, plan, apply, destroy]
      project_config:
        description: "Non-sensitive project config path"
        required: true
        default: "infra/terraform/projects/config/memory-director.json"
      environment_config:
        description: "Non-sensitive environment config path"
        required: true
        default: "infra/terraform/projects/config/sandbox.json"
      api_image:
        description: "Required for app plan/apply/destroy: immutable API image"
        required: false
      web_image:
        description: "Required for app plan/apply/destroy: immutable web image"
        required: false
      service:
        description: "App service state to operate"
        required: false
        type: choice
        options: [api, web]
        default: api
      enable_mcp:
        description: "Enable the private mcp-clickhouse Cloud Run service after bootstrap"
        required: false
        type: boolean
        default: false
      secret_project_id:
        description: "GCP project containing the ClickHouse runtime secret"
        required: false
        default: memory-director-505708
      runtime_secret_name:
        description: "Secret whose latest version contains generated MCP credentials JSON"
        required: false
        default: clickhouse-credentials
      api_base_url:
        description: "Required for web service when operating it independently"
        required: false
      mcp_endpoint:
        description: "Private ClickHouse MCP endpoint from the platform output"
        required: false
      confirm:
        description: "Required only for destroy: DESTROY_SANDBOX"
        required: false

jobs:
  config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/terraform/tools/config-validator/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: infra/terraform/tools/config-validator
      - run: npm run validate -- ../../projects/config/common-environment.json ../../projects/config/sandbox.json ../../projects/config/memory-director.json
        working-directory: infra/terraform/tools/config-validator

  security:
    needs: config-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        working-directory: infra/terraform/components/platform
      - run: tflint --recursive
        working-directory: infra/terraform
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          exit-code: "1"
          severity: HIGH,CRITICAL

  terraform-validate:
    needs: [config-schema, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/modules/foundations/sandbox_platform init -backend=false
      - run: terraform -chdir=infra/terraform/modules/foundations/sandbox_platform validate
      - run: terraform -chdir=infra/terraform/modules/foundations/sandbox_platform test
      - run: terraform -chdir=infra/terraform/modules/foundations/consent_event_writer init -backend=false
      - run: terraform -chdir=infra/terraform/modules/foundations/consent_event_writer validate
      - run: terraform -chdir=infra/terraform/modules/foundations/consent_event_writer test
      - run: terraform -chdir=infra/terraform/modules/foundations/app init -backend=false
      - run: terraform -chdir=infra/terraform/modules/foundations/app validate
      - run: terraform -chdir=infra/terraform/modules/foundations/app test
      - run: terraform -chdir=infra/terraform/components/app init -backend=false
      - run: terraform -chdir=infra/terraform/components/app validate
      - run: terraform -chdir=infra/terraform/modules/foundations/public_edge init -backend=false
      - run: terraform -chdir=infra/terraform/modules/foundations/public_edge validate
      - run: terraform -chdir=infra/terraform/modules/foundations/public_edge test
      - run: terraform -chdir=infra/terraform/components/public-edge init -backend=false
      - run: terraform -chdir=infra/terraform/components/public-edge validate

  terraform-operation:
    if: github.event_name == 'workflow_dispatch'
    needs: [config-schema, security, terraform-validate]
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: memory-director-sandbox-${{ inputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit sandbox destroy confirmation
        if: inputs.operation == 'destroy'
        run: test "${{ inputs.confirm }}" = "DESTROY_SANDBOX"
      - id: config
        name: Read Terraform backend configuration
        shell: bash
        run: |
          set -euo pipefail
          project_config_file="$GITHUB_WORKSPACE/${{ inputs.project_config }}"
          environment_config_file="$GITHUB_WORKSPACE/${{ inputs.environment_config }}"
          test -f "$project_config_file"
          test -f "$environment_config_file"
          state_bucket="$(jq -r '.state_bucket_name // empty' "$project_config_file")"
          project_id="$(jq -r '.project_id // empty' "$project_config_file")"
          resource_name="$(jq -r '.resource_name // empty' "$project_config_file")"
          region="$(jq -r '.region // empty' "$project_config_file")"
          if [ -z "$region" ]; then
            region="$(jq -r '.default_region // empty' infra/terraform/projects/config/common-environment.json)"
          fi
          test -n "$state_bucket"
          test -n "$project_id"
          test -n "$resource_name"
          test -n "$region"
          echo "project_config_file=$project_config_file" >> "$GITHUB_OUTPUT"
          echo "environment_config_file=$environment_config_file" >> "$GITHUB_OUTPUT"
          echo "state_bucket=$state_bucket" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "resource_name=$resource_name" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: agent_engine
        name: Preserve the smoke-tested Agent Engine resource
        if: inputs.component == 'app' && inputs.operation != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          api_json="$(gcloud run services list \
            --project "${{ steps.config.outputs.project_id }}" \
            --region "${{ steps.config.outputs.region }}" \
            --filter="metadata.name=${{ steps.config.outputs.resource_name }}-api" \
            --format=json)"
          test "$(jq 'length' <<< "$api_json")" -le 1
          resource="$(jq -r '[.[0].spec.template.spec.containers[0].env[]? | select(.name == "MEMORY_FILM_PLANNER_RESOURCE") | .value][0] // empty' <<< "$api_json")"
          if [ -n "$resource" ]; then
            [[ "$resource" =~ ^projects/(memory-director-505708|192915586401)/locations/[a-z0-9-]+/reasoningEngines/[0-9]+$ ]]
          fi
          echo "resource=$resource" >> "$GITHUB_OUTPUT"
      - name: Verify MCP runtime secret before enabling Cloud Run
        if: inputs.component == 'platform' && inputs.enable_mcp == true && (inputs.operation == 'plan' || inputs.operation == 'apply')
        env:
          SECRET_PROJECT_ID: ${{ inputs.secret_project_id }}
          RUNTIME_SECRET_NAME: ${{ inputs.runtime_secret_name }}
        run: |
          set -euo pipefail
          gcloud secrets versions access latest \
            --project "$SECRET_PROJECT_ID" \
            --secret "$RUNTIME_SECRET_NAME" \
            | jq -e '(.CLICKHOUSE_HOST | type == "string" and length > 0)
              and (.CLICKHOUSE_USER | type == "string" and length > 0)
              and (.CLICKHOUSE_PASSWORD | type == "string" and length > 0)
              and (.CLICKHOUSE_MCP_AUTH_TOKEN | type == "string" and length > 0)' \
            >/dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize selected daily component
        run: terraform -chdir=infra/terraform/components/${{ inputs.component }} init -backend-config="bucket=${{ steps.config.outputs.state_bucket }}" -backend-config="prefix=memory-director/sandbox/${{ inputs.component }}${{ inputs.component == 'app' && format('-{0}', inputs.service) || '' }}"
      - id: writer
        name: Preserve the deployed consent-writer configuration
        if: inputs.component == 'platform' && inputs.operation != 'validate'
        shell: bash
        run: |
          set -euo pipefail
          writer_image="$(gcloud run services list \
            --project "${{ steps.config.outputs.project_id }}" \
            --region "${{ steps.config.outputs.region }}" \
            --filter="metadata.name=${{ steps.config.outputs.resource_name }}-consent-events" \
            --format='value(spec.template.spec.containers[0].image)' \
            --limit=1)"
          if [ -n "$writer_image" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=$writer_image" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Migrate consent-writer invoker state without deleting its grant
        if: inputs.component == 'platform' && inputs.operation == 'apply' && steps.writer.outputs.enabled == 'true'
        run: infra/terraform/tools/migrate-consent-writer-invoker-state.sh infra/terraform/components/platform
      - name: Run selected operation
        run: |
          if [ "${{ inputs.component }}" = "app" ]; then
            if [ "${{ inputs.operation }}" != "validate" ]; then
              test -n "${{ inputs.api_image }}" && test -n "${{ inputs.web_image }}"
            fi
            image_args="-var=api_image=${{ inputs.api_image }} -var=web_image=${{ inputs.web_image }} -var=service=${{ inputs.service }} -var=api_base_url=${{ inputs.api_base_url }} -var=mcp_endpoint=${{ inputs.mcp_endpoint }}"
            if [ -n "${{ steps.agent_engine.outputs.resource }}" ]; then
              image_args="$image_args -var=agent_engine_resource=${{ steps.agent_engine.outputs.resource }}"
            fi
          else
            image_args="-var=enable_mcp=${{ inputs.enable_mcp }} -var=enable_consent_event_writer=${{ steps.writer.outputs.enabled || 'false' }}"
            if [ "${{ steps.writer.outputs.enabled }}" = "true" ]; then
              image_args="$image_args -var=consent_event_writer_image=${{ steps.writer.outputs.image }}"
            fi
          fi
          case "${{ inputs.operation }}" in
            validate) terraform -chdir=infra/terraform/components/${{ inputs.component }} validate ;;
            plan) terraform -chdir=infra/terraform/components/${{ inputs.component }} plan -var="project_config=${{ steps.config.outputs.project_config_file }}" -var="environment_config=${{ steps.config.outputs.environment_config_file }}" $image_args ;;
            apply) terraform -chdir=infra/terraform/components/${{ inputs.component }} apply -auto-approve -var="project_config=${{ steps.config.outputs.project_config_file }}" -var="environment_config=${{ steps.config.outputs.environment_config_file }}" $image_args ;;
            destroy) terraform -chdir=infra/terraform/components/${{ inputs.component }} destroy -auto-approve -var="project_config=${{ steps.config.outputs.project_config_file }}" -var="environment_config=${{ steps.config.outputs.environment_config_file }}" $image_args ;;
          esac
