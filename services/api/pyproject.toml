[project]
name = "memory-director-api"
version = "0.1.0"
description = "Memory Director production API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
